<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#222d3a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="LernHub für die Klasse ERZ.1.2. Unterrichtsmaterialien, Lernfelder, Quizze und Karteikarten für die Erzieherausbildung." />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%icons/favicon-book.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon-book.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="LernHub" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Restore appearance before the first paint, including on a cold Android start.
      (() => {
        let theme = 'dark';
        try { if (localStorage.getItem('lernhub:theme:v1') === 'light') theme = 'light'; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#e9edf1' : '#222d3a';
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = theme === 'light' ? 'default' : 'black-translucent';
      })();
    </script>
    <title>LernHub · ERZ.1.2</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/app/main.tsx"></script></body>
</html>
