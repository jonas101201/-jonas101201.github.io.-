name: Validate and deploy LernHub
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      # Private materials are never included in the public Pages artifact.
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Require protected materials API for production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          MATERIALS_API_ORIGIN: ${{ vars.MATERIALS_API_ORIGIN }}
        run: |
          if [[ ! "$MATERIALS_API_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+$ ]]; then
            echo 'MATERIALS_API_ORIGIN must be set to the HTTPS Worker origin before production deployment' >&2
            exit 1
          fi
      - name: Build static site
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          VITE_MATERIALS_API_ORIGIN: ${{ vars.MATERIALS_API_ORIGIN }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
